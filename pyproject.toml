[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rusty-cv"
version = "0.1.0"
description = "Small Rust-first computer vision primitives with optional Python bindings."
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]
module-name = "rusty_cv"
