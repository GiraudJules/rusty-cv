name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-python:
    name: Rust and Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/pip install maturin numpy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test

      - name: Check Python feature build
        run: cargo check --features python

      - name: Build Python extension
        run: .venv/bin/maturin develop --features python

      - name: Run Python smoke test
        run: .venv/bin/python scripts/python_smoke_test.py
